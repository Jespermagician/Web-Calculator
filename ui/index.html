<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div id="calculator">
        <div id="screen">
            <div class="screen-content">
                <p id="operation"></p>
                <p id="output">Empty...</p>
            </div>
        </div>
        <div id="numpad">
            <div class="column">
                <div class="btn" onclick="Btn.modulo()">%</div>
                <div class="btn" >1/x</div>
                <div class="btn" onclick="Btn.number(7)">7</div>
                <div class="btn" onclick="Btn.number(4)">4</div>
                <div class="btn" onclick="Btn.number(1)">1</div>
                <div class="btn">+/-</div>
            </div>
            <div class="column">
                <div class="btn" onclick="Btn.ce()">CE</div>
                <div class="btn">x^2</div>
                <div class="btn" onclick="Btn.number(8)">8</div>
                <div class="btn" onclick="Btn.number(5)">5</div>
                <div class="btn" onclick="Btn.number(2)">2</div>
                <div class="btn" onclick="Btn.number(0)">0</div>
            </div>
            <div class="column">
                <div class="btn" onclick="Btn.c()">C</div>
                <div class="btn">2Wx</div>
                <div class="btn" onclick="Btn.number(9)">9</div>
                <div class="btn" onclick="Btn.number(6)">6</div>
                <div class="btn" onclick="Btn.number(3)">3</div>
                <div class="btn">,</div>
            </div>
            <div class="column">
                <div class="btn" onclick="Btn.backspace()">⌫</div>
                <div class="btn" onclick="Btn.divide()">//</div>
                <div class="btn" onclick="Btn.multiply()">X</div>
                <div class="btn" onclick="Btn.substract()">-</div>
                <div class="btn" onclick="Btn.add()">+</div>
                <div class="btn" onclick="Btn.equal()">=</div>
            </div>
        </div>
    </div>
    <div id="debug">
        <p>Debug</p>
        <div>
            Last number: <span id="lastNumber"> - </span>
        </div>
        <div>
            Current number: <span id="currentNumber"> - </span>
        </div>
    </div>
    <script src="../script/script.js"></script> 
</body>
</html>
